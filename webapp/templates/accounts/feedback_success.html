{% extends 'accounts/main.html' %}
{% block content %}

<style>
    body {
        background: url('https://cdn.prod.website-files.com/64022de562115a8189fe542a/663b9b70ff53a383fc50eea2_Feedback-Culture-Exploring-Its-Purpose-Benefits-And-How-To-Build-One.jpg')
        no-repeat center fixed;
        background-size: cover;
        font-family: Arial, sans-serif;
        color: white;
        text-align: center;
        padding: 80px 20px;
    }

    .thank-you-container {
        background: rgba(0, 0, 0, 0.7);
        padding: 30px;
        border-radius: 15px;
        display: inline-block;
        box-shadow: 0 4px 8px rgba(255, 255, 255, 0.2);
        max-width: 400px;
        width: 90%;
        margin: auto;
        text-align: center;
    }

    h2 {
        font-size: 2.5rem;
        color: #ffcc00;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
    }

    p {
        font-size: 1.2rem;
        margin: 20px 0;
    }

    .link {
        display: inline-block;
        padding: 12px 20px;
        background: #ffcc00;
        color: black;
        text-decoration: none;
        font-size: 1rem;
        border-radius: 8px;
        font-weight: bold;
        transition: 0.3s;
        margin-top: 10px;
    }

    .link:hover {
        background: #ffaa00;
        transform: scale(1.1);
    }
</style>

<div class="thank-you-container">
    <h2>🎉 Thank You! 🎉</h2>
    <p>Your feedback has been submitted successfully.</p>
<!--    <a id="link" href="{% url 'home' %}">🏠 Go back to Home</a>-->
</div>

{% endblock content %}
