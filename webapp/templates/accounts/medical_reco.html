{%  extends 'accounts/main.html' %}
{%load static%}
{% block content %}

<!DOCTYPE html>
<html>
<head>
    <title>Table with Background</title>
    <style>
        body {
            background-image: url(https://vertassets.blob.core.windows.net/image/154f0799/154f0799-5241-4c9b-bf0d-6ced5d4a2af9/pulse_line_background_2.jpg); /* Replace with your URL */
            background-size: cover;    /* Make image cover the whole page */
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: Arial, sans-serif;
        }

        table {
            width: 50%;
            border-collapse: collapse; /* Combine borders */
            margin: 50px auto;         /* Center the table */
            background-color: rgba(255, 255, 255, 0.8); /* Semi-transparent background for readability */
        }

        th, td {
            border: 2px solid black;   /* Table borders */
            padding: 15px;
            text-align: center;
        }

        th {
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
        }

        tr:nth-child(even) {
            background-color: rgba(0, 0, 0, 0.1);
        }

         h1.ml3 {
            text-align: center;       /* Center horizontally */
            color: #fff;
            margin-top: 30px;         /* Add some spacing from top */
            font-size: 36px;
        }

    </style>
</head>
<body>
<h1 class="ml3">Medical Recommendations</h1>
    <table>
        <tr>
            <th>MEDICAL NAME</th>
            <th>ADDRESS</th>
            <th>RATING</th>
        </tr>
        <tr>
            <td>{{med1}}</td>
            <td>{{add1}}</td>
            <td>{{rat1}}</td>
        </tr>
        <tr>
            <td>{{med2}}</td>
            <td>{{add2}}</td>
            <td>{{rat2}}</td>
        </tr>
        <tr>
            <td>{{med3}}</td>
            <td>{{add3}}</td>
            <td>{{rat3}}</td>
        </tr>
    </table>

</body>
</html>
{% endblock content %}
