{% load static %}

<style>
  .hello-msg {
    font-size: 18px;
    color: #fff;
    margin-right: 20px;
    display: inline-block;
    transition: transform 0.2s ease;
  }

  .hello-msg:hover {
  transform: scale(1.2);
}

  /* Fixing the navbar at the top */
  .navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 1000; /* Ensures navbar stays above other content */
  }

  .nav-link {
  display: inline-block;
  transition: transform 0.2s ease;
  font-size:1.2rem;
}

.nav-link:hover {
  transform: scale(1.2);
}

.navbar-logo {
  height: 50px; /* or 60px if your navbar is 60px tall */
  width: auto;  /* keeps aspect ratio */
  margin-right: 10px; /* space between logo and nav items */
  background-color: transparent;
}



  /* Push content down so it doesn’t go under the navbar */
  body {
    padding-top: 60px; /* Adjust based on navbar height */
  }
</style>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
