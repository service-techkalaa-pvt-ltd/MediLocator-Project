{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Delete User - Admin</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f7fa; text-align: center; }
        .confirm-box { background: white; padding: 40px; border-radius: 10px; max-width: 500px; margin: 100px auto; }
        .btn { padding: 12px 24px; border: none; border-radius: 5px; cursor: pointer; margin: 10px; }
        .btn-danger { background: #f56565; color: white; }
        .btn-secondary { background: #718096; color: white; text-decoration: none; display: inline-block; }
    </style>
</head>
<body>
    <div class="confirm-box">
        <h2>Delete User</h2>
        <p>Are you sure you want to delete user <strong>{{ user_obj.username }}</strong>?</p>
        <p style="color: #e53e3e;">This action cannot be undone!</p>
        <form method="POST" style="display: inline;">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
        </form>
        <a href="{% url 'admin_users' %}" class="btn btn-secondary">Cancel</a>
    </div>
</body>
</html>
