{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Edit User - Admin</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f7fa; }
        .form-container { background: white; padding: 30px; border-radius: 10px; max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input, select { width: 100%; padding: 10px; border: 2px solid #e2e8f0; border-radius: 5px; }
        .btn { padding: 12px 24px; border: none; border-radius: 5px; cursor: pointer; margin-right: 10px; }
        .btn-primary { background: #667eea; color: white; }
        .btn-secondary { background: #718096; color: white; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Edit User: {{ user_obj.username }}</h2>
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" value="{{ user_obj.username }}" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" value="{{ user_obj.email }}" required>
            </div>
            <div class="form-group">
                <label>First Name</label>
                <input type="text" name="first_name" value="{{ user_obj.first_name }}">
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" name="last_name" value="{{ user_obj.last_name }}">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="text" name="password" placeholder="Enter new password (leave blank to keep current)" style="font-family: monospace;">
                <small style="color: #718096; font-size: 12px; display: block; margin-top: 5px;">
                    ⚠️ Current password cannot be displayed for security reasons. Enter a new password only if you want to change it.
                </small>
            </div>
            <div class="form-group">
                <label>
                    <input type="checkbox" name="is_active" {% if user_obj.is_active %}checked{% endif %}>
                    Active
                </label>
            </div>
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{% url 'admin_users' %}" class="btn btn-secondary" style="text-decoration: none; display: inline-block;">Cancel</a>
        </form>
    </div>
</body>
</html>
