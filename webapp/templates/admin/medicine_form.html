{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>{{ action }} Medicine - Admin</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f7fa; }
        .form-container { background: white; padding: 30px; border-radius: 10px; max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input, textarea { width: 100%; padding: 10px; border: 2px solid #e2e8f0; border-radius: 5px; }
        .btn { padding: 12px 24px; border: none; border-radius: 5px; cursor: pointer; margin-right: 10px; }
        .btn-primary { background: #667eea; color: white; }
        .btn-secondary { background: #718096; color: white; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>{{ action }} Medicine</h2>
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Name</label>
                <input type="text" name="name" value="{{ medicine.name }}" required>
            </div>
            <div class="form-group">
                <label>Category</label>
                <input type="text" name="category" value="{{ medicine.category }}">
            </div>
            <div class="form-group">
                <label>Manufacturer</label>
                <input type="text" name="manufacturer" value="{{ medicine.manufacturer }}">
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea name="description" rows="4">{{ medicine.description }}</textarea>
            </div>
            <div class="form-group">
                <label>Price</label>
                <input type="number" step="0.01" name="price" value="{{ medicine.price }}">
            </div>
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{% url 'admin_medicines' %}" class="btn btn-secondary" style="text-decoration: none; display: inline-block;">Cancel</a>
        </form>
    </div>
</body>
</html>
