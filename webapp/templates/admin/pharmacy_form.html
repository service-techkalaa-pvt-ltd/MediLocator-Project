{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>{{ action }} Pharmacy - Admin</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f7fa; }
        .form-container { background: white; padding: 30px; border-radius: 10px; max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input, textarea { width: 100%; padding: 10px; border: 2px solid #e2e8f0; border-radius: 5px; }
        .btn { padding: 12px 24px; border: none; border-radius: 5px; cursor: pointer; margin-right: 10px; }
        .btn-primary { background: #667eea; color: white; }
        .btn-secondary { background: #718096; color: white; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>{{ action }} Pharmacy</h2>
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Name</label>
                <input type="text" name="name" value="{{ pharmacy.name }}" required>
            </div>
            <div class="form-group">
                <label>Address</label>
                <textarea name="address" rows="3" required>{{ pharmacy.address }}</textarea>
            </div>
            <div class="form-group">
                <label>City</label>
                <input type="text" name="city" value="{{ pharmacy.city }}" required>
            </div>
            <div class="form-group">
                <label>State</label>
                <input type="text" name="state" value="{{ pharmacy.state }}" required>
            </div>
            <div class="form-group">
                <label>PIN Code</label>
                <input type="text" name="pincode" value="{{ pharmacy.pincode }}" required>
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="tel" name="phone" value="{{ pharmacy.phone }}" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" value="{{ pharmacy.email }}">
            </div>
            <div class="form-group">
                <label>Latitude</label>
                <input type="text" name="latitude" value="{{ pharmacy.latitude }}">
            </div>
            <div class="form-group">
                <label>Longitude</label>
                <input type="text" name="longitude" value="{{ pharmacy.longitude }}">
            </div>
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{% url 'admin_pharmacies' %}" class="btn btn-secondary" style="text-decoration: none; display: inline-block;">Cancel</a>
        </form>
    </div>
</body>
</html>
